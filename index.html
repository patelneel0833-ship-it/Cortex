<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Cortex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23050b1f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2360a5fa' stroke-width='2.5'/%3E%3Cpath d='M16 11v7l3 2' stroke='%2337e6c8' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060a;--card:#111218;--tx:#fff;--mu:#8a8d9c;--ok:#34d399;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);overflow-x:hidden}
#home{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
background:radial-gradient(900px 520px at 100% 0,rgba(70,60,200,.30),transparent 70%),radial-gradient(800px 560px at 0 100%,rgba(20,150,140,.22),transparent 70%),var(--bg)}
.wrap{width:100%;max-width:640px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.2em;color:#7d8092;text-transform:uppercase}
h1{font-size:clamp(38px,8vw,58px);font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:18px 0 28px}
.card{position:relative;display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:32px;padding:28px;min-height:196px;overflow:hidden;margin-bottom:18px;transition:transform .25s,border-color .25s;isolation:isolate}
.card::before{content:"";position:absolute;right:-60px;top:50%;width:360px;height:360px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,var(--glow) 0,transparent 68%);z-index:-1;transition:opacity .3s,transform .4s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:rgba(255,255,255,.18);outline:none}
.card:active{transform:scale(.99)}
.card:hover::before{transform:translateY(-50%) scale(1.12)}
.ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--grad);box-shadow:0 10px 30px -6px var(--sh)}
.ico svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.open{position:absolute;right:28px;top:28px;font-size:15px;font-weight:600;color:#8a8d9c}
.open.last{color:var(--hi)}
.card h2{font-size:28px;font-weight:700;letter-spacing:-.025em;margin-top:34px}
.card p{font-size:16px;color:var(--mu);margin-top:6px}
#c1{--glow:rgba(70,90,230,.42);--grad:linear-gradient(135deg,#6366f1,#2563eb 55%,#22d3ee);--sh:rgba(59,110,240,.55);--hi:#7da2ff}
#c2{--glow:rgba(30,200,170,.34);--grad:linear-gradient(135deg,#8b5cf6,#14b8a6);--sh:rgba(80,150,210,.5);--hi:#4fe3c8}
.note{display:flex;gap:14px;align-items:flex-start;margin:26px 4px 0;font-size:15px;line-height:1.5;color:#7d8092}
.note i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-top:7px;box-shadow:0 0 12px var(--ok)}
/* app views */
.app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#000;display:none}
body.in-app{overflow:hidden}
body.in-app #home{display:none}
/* floating home button (lives outside the apps, draggable) */
#home-btn{position:fixed;left:12px;top:70%;z-index:50;display:none;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(20,21,28,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;box-shadow:0 8px 26px rgba(0,0,0,.55);place-items:center;padding:0;touch-action:none;cursor:grab;opacity:.85}
body.in-app #home-btn{display:grid}
#home-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#home-btn:active{opacity:1;transform:scale(.94)}
@media (max-width:520px){.card{padding:22px;min-height:180px;border-radius:28px}.open{right:22px;top:22px}.card h2{font-size:24px;margin-top:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <span class="open" data-for="recall">Open →</span>
      <h2>Recall</h2>
      <p>Flashcards by subject and topic</p>

</main>

  };
  var TITLES={chronos:"Chronos Med",recall:"Recall"};
  var frames={}, btn=document.getElementById('home-btn');

  function b64text(b){
    var s=atob(b),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
    return new TextDecoder('utf-8').decode(a);
  }
  // After an app was hidden/shown, tell it the screen is back so its animations restart.
  function nudge(f){
    [60,350].forEach(function(ms){setTimeout(function(){
      try{
        var w=f.contentWindow,d=f.contentDocument;
        w.dispatchEvent(new Event('resize'));
        d.dispatchEvent(new Event('visibilitychange'));
      }catch(e){}
    },ms)});
  }
  function last(){try{return localStorage.getItem('suite.last')}catch(e){return null}}
  function mark(){
    var l=last();
    document.querySelectorAll('.open').forEach(function(el){
      var is=el.dataset.for===l;
      el.textContent=is?'Last used · Open →':'Open →';
      el.classList.toggle('last',is);
    });
  }
  function show(id){
    if(!SRC[id]){id=null}
    document.body.classList.toggle('in-app',!!id);
    Object.keys(SRC).forEach(function(k){if(frames[k])frames[k].style.display=(k===id)?'block':'none'});
    if(!id){document.title='Cortex';mark();return}
    var fresh=false;
    if(!frames[id]){
      var f=document.createElement('iframe');
      f.className='app';f.title=TITLES[id];
      f.setAttribute('allow','fullscreen');
      f.style.display='block';            // visible BEFORE the app starts, so it measures the real screen size
      document.body.appendChild(f);frames[id]=f;fresh=true;
      f.addEventListener('load',function(){nudge(f)});
      f.srcdoc=b64text(SRC[id]);
    }
    frames[id].style.display='block';
    if(!fresh)nudge(frames[id]);
    document.title=TITLES[id];
    try{localStorage.setItem('suite.last',id)}catch(e){}
  }
  function route(){show((location.hash||'').replace('#',''))}
  window.addEventListener('hashchange',route);
  window.addEventListener('popstate',route);
  [['c1','chronos'],['c2','recall']].forEach(function(p){
    document.getElementById(p[0]).addEventListener('click',function(e){
      e.preventDefault();
      try{history.pushState(null,'','#'+p[1])}catch(x){}
      show(p[1]);
    });
  });

  function goHome(){
    try{history.pushState(null,'',location.pathname+location.search)}catch(x){}
    show(null);
  }
  // draggable button: tap = home, drag = move
  (function(){
    var sx,sy,ox,oy,moved=false,drag=false;
    try{var p=JSON.parse(localStorage.getItem('suite.btn')||'null');if(p){btn.style.left=p.x+'px';btn.style.top=p.y+'px'}}catch(e){}
    function clamp(){
      var r=btn.getBoundingClientRect(),W=innerWidth,H=innerHeight;
      var x=Math.min(Math.max(8,r.left),W-r.width-8),y=Math.min(Math.max(8,r.top),H-r.height-8);
      btn.style.left=x+'px';btn.style.top=y+'px';return{x:x,y:y};
    }
    btn.addEventListener('pointerdown',function(e){
      var r=btn.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;moved=false;drag=true;
      try{btn.setPointerCapture(e.pointerId)}catch(x){}
    });
    btn.addEventListener('pointermove',function(e){
      if(!drag)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;
      if(!moved&&Math.abs(dx)+Math.abs(dy)<8)return;
      moved=true;btn.style.left=(ox+dx)+'px';btn.style.top=(oy+dy)+'px';
    });
    btn.addEventListener('pointerup',function(){
      if(!drag)return;drag=false;
      if(moved){var p=clamp();try{localStorage.setItem('suite.btn',JSON.stringify(p))}catch(x){}}
      else goHome();
    });
    btn.addEventListener('pointercancel',function(){drag=false});
    addEventListener('resize',clamp);
  })();
  route();
})();
